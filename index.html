    />
    <meta name="twitter:image" content="https://edyma.in/logo.png" />
    <!-- GitHub Pages SPA redirect recovery (spa-github-pages) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?').replace(/^\/([^?]*)(\?[^]*)?$/, '$1$2')
          if (decoded !== '/') {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash)
          }
        }
      }(window.location))
    </script>
